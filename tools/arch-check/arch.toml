# Direct dependency policy. Every dependency edge not listed is forbidden.

[crate.relay-core]
allowed-deps = ["bytes", "im", "sha2"]
forbidden-deps = ["rand", "relay-raft", "relay-server", "relay-wal", "tokio"]
forbidden-tokens = ["std::time", "std::fs", "std::io", "std::net", "std::thread", "std::process", "std::env", "std::sync::atomic", "HashMap", "HashSet", "rand::", "tokio::"]

[crate.relay-wal]
allowed-deps = ["bytes", "crc32c", "proptest", "relay-core", "tempfile"]
forbidden-deps = ["relay-raft", "relay-server", "tokio"]
forbidden-tokens = ["std::fs", "SystemTime::now", "Instant::now", "tokio::"]

[crate.relay-raft]
allowed-deps = ["proptest", "relay-core", "relay-wal"]
forbidden-deps = ["rand", "relay-server", "relay-wire", "tokio"]
forbidden-tokens = ["std::time", "rand::", "tokio::"]

[crate.relay-sim]
allowed-deps = ["relay-client", "relay-core", "relay-model", "relay-server"]
forbidden-deps = ["tokio"]
forbidden-tokens = ["std::fs", "std::net", "std::thread", "tokio::"]

[crate.relay-model]
allowed-deps = ["relay-core", "serde", "serde_json", "sha2"]
forbidden-deps = ["relay-raft", "relay-server", "relay-wal", "tokio"]
forbidden-tokens = ["std::time", "std::fs", "std::net", "std::thread", "rand::", "tokio::"]

[crate.relay-wire]
allowed-deps = ["bytes", "crc32c", "hmac", "libfuzzer-sys", "relay-core", "sha2", "subtle"]
forbidden-deps = ["serde", "serde_json", "tokio"]
forbidden-tokens = ["std::fs", "std::io", "std::net", "tokio::"]

[crate.relay-server]
allowed-deps = ["bytes", "hmac", "opentelemetry", "opentelemetry-otlp", "prometheus", "prometheus-client", "relay-core", "relay-raft", "relay-wal", "relay-wire", "rustls", "serde", "serde_json", "sha2", "subtle", "tokio", "tokio-rustls", "toml", "tracing", "tracing-subscriber"]
forbidden-deps = ["relay-cli", "relay-client", "relay-model", "relay-sim"]
forbidden-tokens = []

[crate.relay-client]
allowed-deps = ["bytes", "relay-core", "relay-wire", "tokio"]
forbidden-deps = ["relay-server", "relay-wal"]
forbidden-tokens = []

[crate.relay-cli]
allowed-deps = ["clap", "relay-client", "relay-core", "serde_json", "tokio"]
forbidden-deps = ["relay-raft", "relay-server", "relay-wal"]
forbidden-tokens = []

[crate.relay-bench]
allowed-deps = ["criterion", "hdrhistogram", "relay-client", "relay-server", "tokio"]
forbidden-deps = []
forbidden-tokens = []
